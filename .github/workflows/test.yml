name: Import compatibility
on:
  push:
    branches: [main]
  pull_request:
jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        dsh: ['0.2.2-rc.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install one released DSH cohort
        env:
          DSH_VERSION: ${{ matrix.dsh }}
        run: node test/install-cohort.js
      - run: npm run check && npm test
      - uses: pnpm/action-setup@v4
        if: matrix.node == 24
        with:
          version: '11.21.0'
      - name: Browser dependencies
        if: matrix.node == 24
        run: npx playwright install --with-deps chromium
      - name: Package install, authenticated import, export round-trip and uninstall
        if: matrix.node == 24
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          # 打包文件名随 package.json 版本走，避免升版本后这里仍指向旧 tarball。
          TARBALL="$RUNNER_TEMP/$(node -p "require('./package.json').name + '-' + require('./package.json').version + '.tgz'")"
          DSH_PLUGIN_PACKAGE="$TARBALL" npm run test:web
      - run: npm pack --dry-run
